<body>
  <!-- Loading Indicator -->
  <div id="loading">
    <style>
      body {
        background-color: #121212;
        margin: 0;
        padding: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
      }
      #loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        width: 100vw;
        position: fixed;
        background-color: #121212;
        z-index: 9999;
        transition: opacity 0.4s ease-out;
      }
      .logo {
        width: 80px;
        height: 80px;
        background-color: #4A00E0;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-family: monospace;
        font-size: 24px;
        font-weight: bold;
        margin-bottom: 24px;
      }
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-left-color: #4A00E0;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loading-text {
        margin-top: 16px;
        color: #BDBDBD;
        font-size: 14px;
      }
      #error-message {
        display: none;
        margin-top: 16px;
        color: #ff5252;
        text-align: center;
        max-width: 80%;
        padding: 10px;
      }
      #retry-button {
        display: none;
        margin-top: 16px;
        padding: 8px 16px;
        background-color: #4A00E0;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
        cursor: pointer;
      }
    </style>
    <div class="logo">&lt;/&gt;</div>
    <div class="spinner"></div>
    <div class="loading-text">Loading portfolio...</div>
    <div id="error-message"></div>
    <button id="retry-button" onclick="window.location.reload()">Retry</button>
    <!-- Crawlers and link-preview bots that don't run JavaScript still get the essentials. -->
    <noscript>
      <p style="color:#F3F1F8;max-width:560px;text-align:center;line-height:1.6;">
        Mohamed Reda Oumahdi (MRO-DEV): freelance mobile developer in Agadir, Morocco.
        Flutter + Firebase for cross-platform products, native Swift when iOS demands it.
        Contact: <a style="color:#B9A6FF" href="mailto:mro.devofficial@gmail.com">mro.devofficial@gmail.com</a>.
        This site needs JavaScript enabled.
      </p>
    </noscript>
  </div>

  <script>
    // Loading overlay: fades out on Flutter's first frame, shows a retry
    // button if the app takes unusually long.
    (function () {
      let hasError = false;
      const fadeOutLoading = () => {
        const loadingElement = document.getElementById('loading');
        if (loadingElement) {
          loadingElement.style.opacity = '0';
          setTimeout(() => loadingElement.remove(), 400);
        }
      };

      const showError = (message) => {
        const errorMessage = document.getElementById('error-message');
        const retryButton = document.getElementById('retry-button');
        const spinner = document.querySelector('.spinner');
        const loadingText = document.querySelector('.loading-text');

        hasError = true;
        if (spinner) spinner.style.display = 'none';
        if (loadingText) loadingText.style.display = 'none';
        if (errorMessage) {
          errorMessage.style.display = 'block';
          errorMessage.innerText = message || 'Failed to load the application. Please try again.';
        }
        if (retryButton) retryButton.style.display = 'block';
      };

      const errorTimeout = setTimeout(() => {
        if (!hasError) {
          showError('It seems to be taking longer than expected. There might be an issue loading the app.');
        }
      }, 10000);

      window.addEventListener('flutter-first-frame', () => {
        clearTimeout(errorTimeout);
        fadeOutLoading();
      });

      window.addEventListener('error', (event) => {
        // Only a failed app bundle blocks the page; ignore unrelated script errors.
        const src = event && event.target && event.target.src;
        if (src && /main\.dart\.(js|wasm)|flutter_bootstrap\.js/.test(src)) {
          showError('Failed to load the application. Please check your network connection and try again.');
        }
      }, true);
    })();
  </script>

  <!-- Standard Flutter loader (web/flutter_bootstrap.js, no service worker). -->
  <script src="flutter_bootstrap.js" async></script>
